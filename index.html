<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Default SEO tags; replaced per page by scripts/prerender.mjs -->
    <title>Deniz Özoğul | Software Developer & Team Lead in Istanbul</title>
    <meta name="description" content="Deniz Özoğul is a full-stack and mobile developer and Team Lead at Aras Kargo in Istanbul, building high-load, event-driven microservices, web and mobile apps." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://denizozogul.com/" />
    <meta name="author" content="Deniz Özoğul" />
    <meta name="theme-color" content="#26262d" />
    <meta name="color-scheme" content="dark" />
    <meta name="yandex-verification" content="8cf4077c9b544528" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Load Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap"
      />
    </noscript>

    <!-- CSS -->
    <link rel="stylesheet" href="/css/glitche-basic.css" />
    <link rel="stylesheet" href="/css/glitche-layout.css" />
    <link rel="stylesheet" href="/css/ionicons.css" />

    <link rel="stylesheet" href="/css/template-colors/orange.css" />
    <link rel="stylesheet" href="/css/template-dark/dark.css" />
    <style>
      html {
        scrollbar-face-color: #646464;
        scrollbar-base-color: #646464;
        scrollbar-3dlight-color: #646464;
        scrollbar-highlight-color: #646464;
        scrollbar-track-color: #000;
        scrollbar-arrow-color: #000;
        scrollbar-shadow-color: #646464;
        scrollbar-dark--color: #646464;
      }

      ::-webkit-scrollbar {
        width: 8px;
        height: 3px;
      }

      ::-webkit-scrollbar-button {
        background-color: #666;
      }

      ::-webkit-scrollbar-track {
        background-color: #646464;
      }

      ::-webkit-scrollbar-track-piece {
        background-color: #000;
      }

      ::-webkit-scrollbar-thumb {
        height: 50px;
        background-color: #666;
        border-radius: 3px;
      }

      ::-webkit-scrollbar-corner {
        background-color: #646464;
      }

      ::-webkit-resizer {
        background-color: #666;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script type="module" src="/src/main.js"></script>
    <script defer src="https://analytics.denizozogul.com/script.js" data-website-id="1c8592a2-0aff-4dd1-bad9-80567a9152ee"></script>
  </head>
  <body>
    <noscript>
      <style>.preloader { display: none !important; }</style>
    </noscript>
    <!-- Preloader -->
    <div class="preloader">
      <div class="centrize full-width">
        <div class="vertical-center">
          <div class="pre-inner">
            <div class="load typing-load"><p>loading...</p></div>
            <span class="typed-load"></span>
          </div>
        </div>
      </div>
    </div>
    <div class="container">
      <div id="app"></div>
    </div>

    <!-- jQuery Scripts -->
    <script defer src="/js/jquery.min.js"></script>
    <script defer src="/js/jquery.validate.js"></script>
    <script defer src="/js/typed.js"></script>
    <script defer src="/js/magnific-popup.js"></script>
    <script defer src="/js/imagesloaded.pkgd.js"></script>
    <script defer src="/js/isotope.pkgd.js"></script>

    <!-- Main Scripts -->
    <script defer src="/js/glitche-scripts.js"></script>
  </body>
</html>
