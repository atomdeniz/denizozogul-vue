server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;
    gzip_min_length 1024;

    # /resume/ -> /resume (one canonical URL per page)
    rewrite ^/(.+)/$ /$1 permanent;

    # Each route has its own prerendered HTML (scripts/prerender.mjs);
    # anything else is a real 404 instead of a soft-404 SPA fallback.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;

    # Hashed build assets never change, cache them for a year.
    location ~* "^/(js|css)/.+\.[0-9a-f]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|svg|ico|woff2?|ttf|eot|mp3|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
